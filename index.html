<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TomoRise · Teacher Workspace</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="feedback.css">
  <link rel="stylesheet" href="readability.css">
  <link rel="stylesheet" href="prototype.css">
  <link rel="stylesheet" href="brand.css">
  <link rel="stylesheet" href="sales.css">
  <link rel="stylesheet" href="workspace.css">
  <script defer src="mock-data.js"></script>
  <script defer src="store.js"></script>
  <script defer src="views.js"></script>
  <script defer src="feedback.js"></script>
  <script defer src="questionnaire.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="workspace">
    <header class="topbar"><div class="topbar-shell"><div class="topbar-leading"><img class="brand-logo" src="tomorise-logo.svg" alt="TomoRise" width="168" height="30"><span class="header-divider"></span><span class="header-workspace">Teacher Workspace</span></div><div class="topbar-right"><span class="demo-pill"><i></i>Demo mode</span><div class="header-user"><span class="avatar teacher">SC</span><div><strong>Sarah Chen</strong><small>Trial lesson teacher</small></div></div></div></div></header>
    <section class="prototype-bar" aria-label="Prototype preview controls">
      <div class="prototype-label"><span class="prototype-indicator"></span><div><strong>Prototype preview</strong><small>Switch page states · Demo controls only</small></div></div>
      <div class="prototype-controls"><label class="prototype-subject">Mock lesson <select id="preview-subject" aria-label="Mock lesson subject"><option>Math</option><option>ELA</option></select></label><div class="state-switch" role="group" aria-label="Prototype page state"><button data-scene="pending" aria-pressed="true">Pending</button><button data-scene="completed" aria-pressed="false">Completed</button></div><button class="text-button reset-demo" data-action="reset">Reset demo data ↻</button></div>
    </section>
    <div class="page-trail"><span id="breadcrumb">Post-lesson feedback</span></div>
    <main id="app" tabindex="-1"></main>
    <footer class="site-footer"><span>Mock workspace · Fictional student data · No actual report delivery</span><span>One lesson record · One draft · One submission</span></footer>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
